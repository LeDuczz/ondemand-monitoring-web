name: Web CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - feature/depot-management-ui

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Monitoring UI regression tests
        run: npm run test -- src/features/customer/pages/CreateOrder/components/ContentStep.test.tsx src/features/customer/lib/checklist/checklist.test.tsx

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
